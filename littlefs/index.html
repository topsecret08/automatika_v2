<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Automatika — управление ректификацией и дистилляцией">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Automatika">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <title>Automatika</title>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <span id="page-title" class="header-title">Automatika</span>
      <div class="header-actions">
        <button id="install-btn" class="btn btn-secondary hidden" type="button" hidden>
          Установить
        </button>
        <span id="connection-status" class="status-dot offline" aria-hidden="true"></span>
        <span id="connection-label" class="status-label">Offline</span>
      </div>
    </div>
  </header>

  <main id="app" class="content" role="main">
    <div class="empty">Загрузка…</div>
  </main>

  <nav class="tab-bar" aria-label="Основная навигация">
    <a href="/?page=dashboard" data-page="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <span>Дашборд</span>
    </a>
    <a href="/?page=fractions" data-page="fractions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M12 2v20M2 12h20"/>
      </svg>
      <span>Фракции</span>
    </a>
    <a href="/?page=settings" data-page="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
      <span>Настройки</span>
    </a>
    <a href="/?page=log" data-page="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h10"/>
      </svg>
      <span>Журнал</span>
    </a>
  </nav>

  <noscript>
    <div class="content"><div class="banner banner-warn">
      Для работы интерфейса нужен JavaScript.
    </div></div>
  </noscript>

  <script src="/js/app.js" type="module"></script>
</body>
</html>
