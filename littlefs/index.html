<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d6efd">
  <meta name="description" content="Automatika — управление дистилляцией">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Automatika">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <title>Automatika</title>
</head>
<body>
  <header>
    <h1>⚗ Automatika</h1>
    <div class="header-actions">
      <span id="connection-status" class="status offline">Offline</span>
      <button id="install-btn" class="install-btn" type="button" hidden>Установить</button>
    </div>
  </header>

  <main id="content">
    <!-- Дашборд -->
    <section id="page-dashboard" class="page">
      <div class="cards">
        <div class="card"><div class="label">Куб</div><div class="value" id="cube">—</div></div>
        <div class="card"><div class="label">Царга</div><div class="value" id="col">—</div></div>
        <div class="card"><div class="label">Мощность</div><div class="value" id="pwr">—</div></div>
        <div class="card"><div class="label">Этап</div><div class="value" id="stg">—</div></div>
      </div>
      <div class="controls">
        <button type="button" data-action="/api/start">▶ Старт</button>
        <button type="button" data-action="/api/pause">⏸ Пауза</button>
        <button type="button" data-action="/api/stop">⏹ Стоп</button>
        <button type="button" data-action="/api/safety">🛡 Сброс аварии</button>
      </div>
      <div class="controls slider-row">
        <label for="power">Мощность:</label>
        <input id="power" type="range" min="0" max="100" step="1" value="0">
        <span id="pwrset">0%</span>
      </div>
      <canvas id="chart" height="200"></canvas>
      <p id="action-result" class="hint" role="status"></p>
    </section>

    <!-- Журнал событий -->
    <section id="page-log" class="page" hidden>
      <div class="controls">
        <button type="button" id="log-refresh">Обновить</button>
      </div>
      <p class="hint">Журнал требует API-ключ: укажите его на вкладке «Настройки».</p>
      <div id="log-list" class="log-list"></div>
    </section>

    <!-- Настройки PWA -->
    <section id="page-settings" class="page" hidden>
      <div class="card settings-card">
        <label for="api-key">API-ключ (X-API-Key)</label>
        <input id="api-key" type="password" autocomplete="off" placeholder="32 hex-символа">
        <div class="controls">
          <button type="button" id="key-save">Сохранить</button>
          <button type="button" id="key-generate">Сгенерировать на устройстве</button>
          <button type="button" id="key-clear">Забыть</button>
        </div>
        <p id="key-status" class="hint" role="status"></p>
        <p class="hint">Ключ хранится только в localStorage этого браузера и не
          передаётся никуда, кроме вашего устройства Automatika.</p>
        <p class="hint">Версия интерфейса: <span id="app-version">—</span></p>
      </div>
    </section>
  </main>

  <nav id="bottom-nav">
    <a href="#dashboard" data-page="dashboard">Дашборд</a>
    <a href="#log" data-page="log">Журнал</a>
    <a href="#settings" data-page="settings">Настройки</a>
  </nav>

  <script src="/charts.js"></script>
  <script src="/api.js"></script>
  <script src="/app.js"></script>
  <script src="/ws.js"></script>
</body>
</html>
