<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Automatika — управление ректификацией и дистилляцией">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Automatika">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <title>Automatika</title>
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <span id="page-title" class="header-title">Automatika</span>
      <div class="header-actions">
        <button id="install-btn" class="btn btn-secondary hidden" type="button" hidden>
          Установить
        </button>
        <span id="connection-status" class="status-dot offline" aria-hidden="true"></span>
        <span id="connection-label" class="status-label">Offline</span>
      </div>
    </div>
  </header>

  <main id="app" class="content" role="main">
    <div class="empty">Загрузка…</div>
  </main>

  <nav id="tab-bar" class="tab-bar" aria-label="Основная навигация"></nav>

  <noscript>
    <div class="content"><div class="banner banner-warn">
      Для работы интерфейса нужен JavaScript.
    </div></div>
  </noscript>

  <script src="/js/app.js" type="module"></script>
</body>
</html>
