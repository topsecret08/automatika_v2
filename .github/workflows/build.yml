name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: host logic tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S test/host -B test/host/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build test/host/build --parallel

      - name: Run
        run: ctest --test-dir test/host/build --output-on-failure

  static-analysis:
    name: static analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build cppcheck 2.22.0
        run: |
          git clone --depth 1 --branch 2.22.0 \
            https://github.com/danmar/cppcheck.git /tmp/cppcheck-src
          cmake -S /tmp/cppcheck-src -B /tmp/cppcheck-build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build /tmp/cppcheck-build --parallel "$(nproc)"

      - name: Run cppcheck
        run: |
          /tmp/cppcheck-build/bin/cppcheck \
            --enable=warning,performance,portability \
            --std=c11 --language=c \
            --suppress=missingIncludeSystem --inline-suppr \
            --suppressions-list=tools/cppcheck-suppressions.txt \
            --error-exitcode=1 \
            --template='{file}:{line}:{severity}:{id}:{message}' \
            -I main \
            -i main/ui/fonts \
            -i main/control/autopid_glue.cpp \
            main

  python-tools:
    name: python tools and docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests for tools
        run: |
          pip install -q "cryptography==50.0.2"
          python -m unittest discover -s tools/tests -v

      - name: Generated API docs are up to date
        run: python tools/gen_api_docs.py --check

      - name: SBOM smoke run
        run: |
          python tools/gen_release_metadata.py \
            --sbom /tmp/sbom.spdx.json \
            --manifest /tmp/build-info.json
          python -m json.tool /tmp/sbom.spdx.json >/dev/null
          python -m json.tool /tmp/build-info.json >/dev/null

  pwa-e2e:
    name: PWA end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run E2E
        run: python -m pytest tools/e2e -q

  config-matrix:
    name: config (${{ matrix.profile }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, full]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with profile
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          cp sdkconfig.defaults sdkconfig.defaults.base
          cat sdkconfig.defaults.base \
              "tools/config_profiles/${{ matrix.profile }}.defaults" \
              > sdkconfig.defaults
          idf.py set-target esp32s3
          idf.py build
          idf.py size | tee "build/size-${{ matrix.profile }}.txt"

  firmware:
    name: firmware (esp32s3)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          idf.py size | tee build/size.txt
          python tools/check_build_size.py \
            --map build/automatika_v2.map \
            --bin build/automatika_v2.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: automatika-v0.9-beta-${{ github.sha }}
          path: |
            build/automatika_v2.bin
            build/automatika_v2.elf
            build/automatika_v2.map
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/assets.bin
            build/size.txt
          if-no-files-found: error

  hmi-firmware:
    name: HMI panel (esp32s3)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Protocol host test
        run: bash firmware_hmi_project/tests/run_test_proto.sh

      - name: Build HMI firmware
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          idf.py -C firmware_hmi_project set-target esp32s3
          idf.py -C firmware_hmi_project build
          idf.py -C firmware_hmi_project size | tee firmware_hmi_project/build/size.txt

      - name: Upload HMI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: automatika-hmi-${{ github.sha }}
          path: |
            firmware_hmi_project/build/hmi_panel.bin
            firmware_hmi_project/build/hmi_panel.elf
            firmware_hmi_project/build/hmi_panel.map
            firmware_hmi_project/build/bootloader/bootloader.bin
            firmware_hmi_project/build/partition_table/partition-table.bin
            firmware_hmi_project/build/size.txt
          if-no-files-found: error

  esp-tests:
    name: ESP-IDF Unity tests in QEMU
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Unity test app
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          idf.py -C test set-target esp32s3
          idf.py -C test build

      - name: Install QEMU
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa

      - name: Run Unity tests in QEMU
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          python test/qemu/run_qemu_tests.py --build-dir test/build

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: automatika-test-${{ github.sha }}
          path: |
            test/build/automatika_test.bin
            test/build/automatika_test.elf
            test/build/automatika_test.map
          if-no-files-found: error
